<!-- filepath: public/index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<!-- TAB: Кейсы -->
<div class="container tab is-active" id="tab-cases">
    <div class="case" id="vip-case" role="button" tabindex="0" aria-label="Открыть VIP кейс">
        <h2>🎁 VIP Case</h2>
        <p>Tap to open</p>
    </div>
</div>

<!-- TAB: Апгрейд -->
<div class="container tab" id="tab-upgrade" aria-hidden="true">
    <div class="upgrade-root">
        <!-- левая колонка: выбор предмета -->
        <div class="up-left">
            <div class="up-col-title">Ваш предмет</div>
            <div class="up-list" id="upList"></div>
        </div>

        <!-- центр: колесо + мультипликаторы + кнопка -->
        <div class="up-center">
            <div class="up-wheel" id="upWheel">
                <!-- 300x300 viewBox — рисуем кольцо и сектор успеха, курсор крутится -->
                <svg id="upSvg" viewBox="0 0 300 300" aria-hidden="true">
                    <!-- кольцо фона -->
                    <circle cx="150" cy="150" r="118" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="40"/>
                    <circle cx="150" cy="150" r="118" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="2"/>

                    <!-- сектор успеха — обновляется JS -->
                    <path id="upArc" fill="rgba(52,199,89,.35)" stroke="rgba(52,199,89,.9)" stroke-width="2"/>

                    <!-- метки (необязательные) -->
                    <circle cx="150" cy="150" r="98" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="1" stroke-dasharray="2 6"/>

                    <!-- курсор: линия + наконечник, вращается вокруг центра -->
                    <g id="upPointer">
                        <path d="M150 150 L150 26" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/>
                        <polygon points="150,16 144,30 156,30" fill="var(--accent)"/>
                    </g>
                </svg>
            </div>

            <!-- мультипликаторы -->
            <div class="up-mults" id="upMults" role="tablist" aria-label="Мультипликатор">
                <!-- кнопки рисует JS -->
            </div>

            <div class="up-chance-row">Шанс: <span id="upChance">—</span></div>

            <!-- кнопка действия -->
            <button class="up-action" id="upAction">Апгрейд</button>

            <!-- мини-статус -->
            <div class="up-status" id="upStatus" aria-live="polite"></div>
        </div>

        <!-- правая колонка: что получим -->
        <div class="up-right">
            <div class="up-col-title">Получите при успехе</div>
            <div class="up-preview" id="upPreview">
                <div class="up-target-card">
                    <div class="up-target-img-wrap"><img id="upTargetImg" alt=""></div>
                    <div class="up-target-name" id="upTargetName">—</div>
                    <div class="up-target-mult" id="upTargetMult">x—</div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- TAB: Профиль -->
<div class="container tab" id="tab-profile" aria-hidden="true">
    <div class="profile-root">
        <div class="profile-chips">
            <div class="chip chip-compact" title="Регион">🇷🇺</div>
            <div class="chip chip-compact" title="Устройство">📱</div>
            <div class="chip chip-balance" role="group" aria-label="Баланс">
                <span class="chip-ico" aria-hidden="true">💎</span>
                <span class="val">0.00</span>
                <button class="add-btn" type="button" aria-label="Пополнить баланс">+</button>
            </div>
        </div>

        <div class="profile-avatar">
            <img src="gift1.svg" alt="Аватар" />
        </div>
        <div class="profile-name">Michael <span class="bio">{bio}</span></div>

        <div class="profile-actions">
            <button type="button" class="btn btn-primary">
                <span class="btn-txt">Пополнить</span>
                <span class="btn-ico" aria-hidden="true">🎁</span>
            </button>
            <button type="button" class="btn btn-outline">
                <span class="btn-txt">Пополнить</span>
                <span class="btn-ico" aria-hidden="true">💎</span>
            </button>
        </div>

        <div class="profile-card">
            <div class="profile-card-header">
                <div class="title">Инвентарь (0)</div>
                <button type="button" class="btn btn-chip">Продать все</button>
            </div>
            <div class="inv-grid">
                <div class="inv-item"><img src="gift.svg" alt="" /></div>
                <div class="inv-item"><img src="gift.svg" alt="" /></div>
                <div class="inv-item"><img src="gift.svg" alt="" /></div>
            </div>
        </div>
    </div>
</div>

<!-- Слайдер (оверлей) -->
<div class="slider" id="slider">
    <div class="slider-backdrop" id="sliderBackdrop"></div>
    <div class="slider-content" id="sliderContent">
        <div class="header-row">
            <h2 class="title">VIP Case</h2>
            <button class="close" id="closeBtn" aria-label="Закрыть">✕</button>
        </div>

        <div class="roulette-container" id="rouletteContainer">
            <div class="roulette" id="roulette"></div>
            <div class="roulette-marker"></div>
        </div>

        <div id="footer-bar">
            <button class="open-btn" id="spinBtn">Открыть</button>
        </div>

        <h3 class="section-title">Что внутри?</h3>
        <div class="gallery" id="gallery"></div>
    </div>
</div>

<!-- Результат -->
<div class="result-overlay" id="resultOverlay" aria-hidden="true">
    <div class="result-sheet" id="resultSheet">
        <div class="sheet-handle" id="sheetHandle"></div>
        <h3 class="result-title">Поздравляем!</h3>
        <div class="result-card"><img id="resultImg" alt="" /></div>
        <div class="result-amount"><span id="resultAmount">+0</span> <span class="dim">💎</span></div>
        <div class="result-name" id="resultName">—</div>
        <button class="result-ok" id="resultOk">Ок</button>
    </div>
</div>

<!-- Нижний таб-бар -->
<nav class="tabbar" id="app-tabbar" role="tablist" aria-label="Основная навигация">
    <button id="btn-tab-cases" class="tabbtn is-active" role="tab" aria-selected="true" aria-controls="tab-cases">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24"><use href="icons.svg#case" xlink:href="icons.svg#case"/></svg>
      </span>
        <span class="lbl">Кейсы</span>
    </button>
    <button id="btn-tab-upgrade" class="tabbtn" role="tab" aria-selected="false" aria-controls="tab-upgrade">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24"><use href="icons.svg#upgrade" xlink:href="icons.svg#upgrade"/></svg>
      </span>
        <span class="lbl">Апгрейд</span>
    </button>
    <button id="btn-tab-profile" class="tabbtn" role="tab" aria-selected="false" aria-controls="tab-profile">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24"><use href="icons.svg#user" xlink:href="icons.svg#user"/></svg>
      </span>
        <span class="lbl">Профиль</span>
    </button>
</nav>

<!-- Telegram SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="vip.js"></script>
</body>
</html>
